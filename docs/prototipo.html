<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dock Windows — Protótipo de Interface</title>
  <style>
    :root {
      --bg-desktop: #1e222d;
      --dock-bg: rgba(24, 24, 26, 0.88);
      --dock-border: rgba(255, 255, 255, 0.12);
      --dock-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
      --text-primary: #ffffff;
      --text-secondary: #9e9ea7;
      --card-bg: rgba(255, 255, 255, 0.06);
      --card-hover: rgba(255, 255, 255, 0.14);
      --accent: #0078d4;
      --accent-hover: #2b88d8;
    }
    
    body.light-theme {
      --bg-desktop: #e8ecf2;
      --dock-bg: rgba(245, 245, 247, 0.92);
      --dock-border: rgba(0, 0, 0, 0.1);
      --dock-shadow: 0 14px 30px rgba(0, 0, 0, 0.15);
      --text-primary: #1c1c1e;
      --text-secondary: #6e6e73;
      --card-bg: rgba(0, 0, 0, 0.04);
      --card-hover: rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: var(--bg-desktop);
      background-image: radial-gradient(circle at 50% 30%, rgba(255,255,255,0.05), transparent 70%);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      padding: 24px;
      transition: background 0.3s ease, color 0.3s ease;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.2);
      padding: 12px 20px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
    }

    .badge-info {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .theme-toggle-btn {
      background: var(--card-bg);
      border: 1px solid var(--dock-border);
      color: var(--text-primary);
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .theme-toggle-btn:hover {
      background: var(--card-hover);
    }

    /* Floating Dock */
    .dock-container {
      align-self: center;
      margin-bottom: 24px;
      position: relative;
    }

    .dock-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--dock-bg);
      border: 1px solid var(--dock-border);
      box-shadow: var(--dock-shadow);
      backdrop-filter: blur(24px);
      padding: 8px 14px;
      border-radius: 20px;
      user-select: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .divider {
      width: 1px;
      height: 30px;
      background: var(--dock-border);
    }

    /* Environment Pills */
    .env-group {
      display: flex;
      background: var(--card-bg);
      padding: 4px;
      border-radius: 14px;
      gap: 4px;
    }

    .env-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .env-btn:hover {
      color: var(--text-primary);
      background: rgba(255,255,255,0.06);
    }

    .env-btn.active {
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 120, 212, 0.35);
    }

    /* Items */
    .items-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dock-item {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--card-bg);
      border: 1px solid transparent;
      cursor: pointer;
      position: relative;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.15s ease, border-color 0.15s ease;
    }

    .dock-item:hover {
      transform: translateY(-6px) scale(1.1);
      background: var(--card-hover);
      border-color: var(--dock-border);
      box-shadow: 0 6px 14px rgba(0,0,0,0.25);
    }

    .dock-item:active {
      transform: translateY(-2px) scale(0.98);
    }

    .dock-item svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .item-tooltip {
      position: absolute;
      top: -36px;
      background: rgba(15, 15, 17, 0.95);
      color: #fff;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 6px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.15s ease, transform 0.15s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .dock-item:hover .item-tooltip {
      opacity: 1;
      transform: translateY(0);
    }

    /* Widgets */
    .widget-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .widget-pill {
      background: var(--card-bg);
      border: 1px solid var(--dock-border);
      padding: 6px 12px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .widget-pill:hover {
      background: var(--card-hover);
    }

    .clock-time {
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .pomodoro-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      color: #ff9f0a;
    }

    .pomo-btn {
      background: rgba(255, 159, 10, 0.2);
      border: none;
      color: #ff9f0a;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
    }

    .pomo-btn:hover {
      background: rgba(255, 159, 10, 0.4);
    }

    /* Actions */
    .action-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--card-bg);
      border: 1px solid var(--dock-border);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      background: var(--card-hover);
      color: var(--text-primary);
    }

    .demo-info {
      text-align: center;
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <strong>Dock Windows</strong> — Protótipo de Conceito Visual
      <span class="badge-info">(Etapa 02: Design da Interface)</span>
    </div>
    <button class="theme-toggle-btn" id="themeToggle" onclick="toggleTheme()">
      🌙 Alternar Tema (Claro / Escuro)
    </button>
  </header>

  <div class="demo-info">
    <p>Experimente alternar entre os ambientes abaixo para visualizar as cores de acento e itens dedicados.</p>
    <p>Passe o mouse sobre os itens para conferir o feedback tátil, sombras e elevações.</p>
  </div>

  <div class="dock-container">
    <div class="dock-bar" role="toolbar" aria-label="Dock Windows">
      
      <!-- Seletor de Ambientes -->
      <div class="env-group" role="tablist">
        <button class="env-btn active" id="env-work" onclick="setEnvironment('work', '#0078d4', 'Trabalho')">
          💼 Trabalho
        </button>
        <button class="env-btn" id="env-study" onclick="setEnvironment('study', '#107c41', 'Estudos')">
          📚 Estudos
        </button>
        <button class="env-btn" id="env-personal" onclick="setEnvironment('personal', '#8764b8', 'Pessoal')">
          🎮 Pessoal
        </button>
      </div>

      <div class="divider"></div>

      <!-- Itens Fixados Dinâmicos -->
      <div class="items-group" id="itemsList">
        <!-- Renderizado via script -->
      </div>

      <div class="divider"></div>

      <!-- Widgets -->
      <div class="widget-group">
        <!-- Relógio -->
        <div class="widget-pill" title="Clique para ver o calendário">
          <span>🕒</span>
          <span class="clock-time" id="clockDisplay">19:45</span>
        </div>

        <!-- Pomodoro -->
        <div class="widget-pill" title="Pomodoro de Foco">
          <div class="pomodoro-badge">
            <span>⏱️</span>
            <span id="pomoTime">25:00</span>
          </div>
          <button class="pomo-btn" id="pomoPlayBtn" onclick="togglePomodoro()">▶</button>
        </div>
      </div>

      <div class="divider"></div>

      <!-- Ações -->
      <div style="display: flex; gap: 6px;">
        <button class="action-btn" title="Adicionar Novo Item Fixado" onclick="alert('Diálogo para fixar aplicativo, arquivo, pasta ou URL')">➕</button>
        <button class="action-btn" title="Configurações da Dock" onclick="alert('Abre Janela de Configurações em pt-BR')">⚙️</button>
      </div>

    </div>
  </div>

  <script>
    const environmentsData = {
      work: {
        accent: '#0078d4',
        items: [
          { name: 'Navegador Web', icon: '🌐', path: 'https://google.com' },
          { name: 'Editor de Código', icon: '💻', path: 'code.exe' },
          { name: 'Documentos do Trabalho', icon: '📁', path: 'C:\\Projetos' },
          { name: 'Terminal PowerShell', icon: '⚡', path: 'powershell.exe' }
        ]
      },
      study: {
        accent: '#107c41',
        items: [
          { name: 'Livros e PDFs', icon: '📖', path: 'C:\\Estudos\\Livros' },
          { name: 'Anotações & Notas', icon: '📝', path: 'notepad.exe' },
          { name: 'Calculadora Científica', icon: '🧮', path: 'calc.exe' },
          { name: 'Plataforma de Cursos', icon: '🎓', path: 'https://coursera.org' }
        ]
      },
      personal: {
        accent: '#8764b8',
        items: [
          { name: 'Música & Áudio', icon: '🎵', path: 'spotify.exe' },
          { name: 'Galeria de Fotos', icon: '🖼️', path: 'C:\\Fotos' },
          { name: 'Jogos & Lazer', icon: '🎮', path: 'steam.exe' },
          { name: 'Vídeos & Streaming', icon: '🍿', path: 'https://youtube.com' }
        ]
      }
    };

    let currentEnv = 'work';

    function setEnvironment(key, color, label) {
      currentEnv = key;
      document.documentElement.style.setProperty('--accent', color);
      
      document.querySelectorAll('.env-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('env-' + key).classList.add('active');

      renderItems();
    }

    function renderItems() {
      const container = document.getElementById('itemsList');
      container.innerHTML = '';
      const data = environmentsData[currentEnv];
      data.items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'dock-item';
        div.innerHTML = `
          <span style="font-size: 20px;">${item.icon}</span>
          <span class="item-tooltip">${item.name} (${item.path})</span>
        `;
        div.onclick = () => alert(`Lançando: ${item.name}\nDestino: ${item.path}`);
        container.appendChild(div);
      });
    }

    function toggleTheme() {
      document.body.classList.toggle('light-theme');
      const isLight = document.body.classList.contains('light-theme');
      document.getElementById('themeToggle').textContent = isLight ? '☀️ Modo Claro Ativo' : '🌙 Modo Escuro Ativo';
    }

    // Relógio
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clockDisplay').textContent = `${hours}:${minutes}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Pomodoro simples
    let pomoSeconds = 25 * 60;
    let pomoTimer = null;
    function togglePomodoro() {
      const btn = document.getElementById('pomoPlayBtn');
      if (pomoTimer) {
        clearInterval(pomoTimer);
        pomoTimer = null;
        btn.textContent = '▶';
      } else {
        btn.textContent = '⏸';
        pomoTimer = setInterval(() => {
          if (pomoSeconds > 0) {
            pomoSeconds--;
            const m = String(Math.floor(pomoSeconds / 60)).padStart(2, '0');
            const s = String(pomoSeconds % 60).padStart(2, '0');
            document.getElementById('pomoTime').textContent = `${m}:${s}`;
          } else {
            clearInterval(pomoTimer);
            pomoTimer = null;
            btn.textContent = '▶';
            alert('Ciclo de Pomodoro Concluído!');
          }
        }, 1000);
      }
    }

    renderItems();
  </script>
</body>
</html>
